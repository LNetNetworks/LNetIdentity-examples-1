<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Wallet de credenciales verificables para el rol Holder.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wallet Holder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#05070E">

  <title>Wallet Holder — Credenciales verificables</title>
  <link rel="manifest" href="manifest.json">
  <style id="wallet-bootstrap-style">
    /* Evita el flash blanco mientras carga el canvas de Flutter. */
    html, body { background-color: #05070E; margin: 0; padding: 0; }
  </style>
  <script>
    // Puente para el botón "Instalar app" del login (lib/pwa_install_web.dart).
    //
    // `beforeinstallprompt` se dispara una sola vez y bastante antes de que
    // Flutter termine de arrancar, así que hay que capturarlo acá —de forma
    // síncrona en el <head>— y guardarlo para usarlo cuando el usuario toque
    // el botón.
    (function () {
      var deferredPrompt = null;
      var listeners = [];

      function notify() {
        listeners.forEach(function (listener) { listener(); });
      }

      window.addEventListener('beforeinstallprompt', function (event) {
        // Cancela el mini-infobar de Chrome: lo reemplaza el botón de la app.
        event.preventDefault();
        deferredPrompt = event;
        notify();
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        notify();
      });

      window.walletPwa = {
        isInstalled: function () {
          return window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true;
        },
        canPrompt: function () { return deferredPrompt !== null; },
        isIos: function () {
          // iPadOS 13+ se anuncia como Macintosh, de ahí el chequeo táctil.
          var ua = window.navigator.userAgent;
          return /iPad|iPhone|iPod/.test(ua) ||
            (/Macintosh/.test(ua) && window.navigator.maxTouchPoints > 1);
        },
        prompt: function () {
          if (deferredPrompt === null) return Promise.resolve(false);

          var event = deferredPrompt;
          // El evento no se puede reutilizar. Si el usuario cancela, Chrome lo
          // vuelve a disparar más tarde y el listener de arriba lo recaptura.
          deferredPrompt = null;
          notify();

          return event.prompt()
            .then(function () { return event.userChoice; })
            .then(function (choice) { return choice.outcome === 'accepted'; })
            .catch(function () { return false; });
        },
        onChange: function (listener) { listeners.push(listener); },
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
